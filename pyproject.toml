[tool.poetry]
name = "bertgcn"
version = "0.1.0"
description = "Production-ready BertGCN framework for clinical text classification"
authors = ["Clinical AI Team <team@clinicalai.org>"]
readme = "README.md"
packages = [{include = "bertgcn", from = "src"}]

[tool.poetry.dependencies]
python = "^3.8.1"
torch = "^2.0.0"
transformers = "^4.30.0"
scikit-learn = "^1.3.0"
scipy = "^1.10.0"
numpy = "^1.24.0"
pytorch-lightning = "^2.0.0"
datasets = "^2.13.0"
nltk = "^3.8.0"
click = "^8.1.0"
torch-geometric = "^2.3.0"
dgl = "^1.1.0"
pandas = "^2.0.0"
pydantic = "^2.0.0"
mlflow = "^2.5.0"
wandb = "^0.15.0"
hydra-core = "^1.3.0"
rich = "^13.4.0"
typer = "^0.9.0"
pyyaml = "^6.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.4.0"
bandit = "^1.7.0"

[tool.poetry.group.monitoring.dependencies]
prometheus-client = "^0.17.0"
grafana-client = "^3.5.0"
docker = "^6.1.0"

[tool.poetry.scripts]
bertgcn = "bertgcn.simple_cli:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.8"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=src/bertgcn"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "if __name__ == .__main__.:",
]