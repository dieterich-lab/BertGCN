[tool.poetry]
name = "bertgcn"
version = "0.1.0"
description = "BertGCN: A BERT-based Graph Convolutional Network for document classification"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/dieterich-lab/BertGCN"
packages = [{include = "bertgcn", from = "."}]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
numpy = "<2.0"
scipy = ">=1.7.0"
pandas = ">=1.3.0"
scikit-learn = ">=1.0.0"
transformers = ">=4.15.0"
accelerate = ">=0.26.0"
pytest = ">=7.0.0"
tqdm = ">=4.62.0"
torch = "2.8.0"  # Compatible with CUDA 12.6
# torch = "2.8.0+cu126"  # Compatible with CUDA 12.6
torchvision = "0.23.0"
torchdata = "^0.9.0"
# dgl = "2.1.0"  # Replaced with PyTorch Geometric for easier installation
torch-geometric = "^2.5.0"
torch-scatter = "2.1.2"
torch-sparse = "0.6.18"
torch-cluster = "1.6.3"
typer = ">=0.9.0"  # CLI app builder with type hints
importlib-metadata = "^8.7.0"
mlflow = "^2.15.1"
omegaconf = "^2.3.0"
hydra-core = "^1.3.2"
hydra-optuna-sweeper = "^1.2.0"
shap = "^0.46.0"
lime = "^0.2.0.1"
ray = {extras = ["tune"], version = "^2.24.0"}
optuna = "^2.10.0"
tensorboard = "^2.17.0"
joblib = "^1.4.2"
toml = "^0.10.2"
datasets = "^2.14.5"
pyarrow = "^14.0.1"
pydantic = "<2.0"
matplotlib = ">=3.5.0"
seaborn = ">=0.11.0"

[tool.poetry.group.dev.dependencies]
black = "^23.3.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
pytest = "^7.0.0"
pytest-cov = "^4.1.0"
jupyter = "^1.0.0"
ipykernel = "^6.0.0"
ipywidgets = "^8.1.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.poetry.scripts]
bertgcn = "bertgcn.cli:main"
preprocess = "bertgcn.preprocess:preprocess"
build-graph = "bertgcn.build_graph:main"
finetune = "bertgcn.train_bert:main"
train = "bertgcn.train_gcn:main"
predict = "bertgcn.predict:main"
interpret = "bertgcn.interpret:main"
interpret-docs-neighbors = "bertgcn.interpret_docs_neighbors:main"
interpret-docs-ig = "bertgcn.interpret_docs_ig:main"
interpret-docs-shap = "bertgcn.interpret_docs_shap:main"
interpret-tokens-ig = "bertgcn.interpret_tokens_ig:main"
select-precedents = "bertgcn.select_precedents:main"
select-precedents-hierarchical = "bertgcn.select_precedents_hierarchical:main"
# Legacy aliases for backward compatibility
finetune-bert = "bertgcn.train_bert:main"
train-bertgcn = "bertgcn.train_gcn:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
