[tool.poetry]
name = "bertgcn"
version = "0.1.0"
description = "BertGCN: Research prototype for document/word graph construction with BERT and GCN"
authors = ["Research Team <research@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.8"
torch = "^2.0.0"
transformers = "^4.1.0"
numpy = "^1.21.0"
scipy = "^1.7.0"
scikit-learn = "^1.0.0"
pandas = "^1.3.0"
datasets = "^2.0.0"
nltk = "^3.6"
networkx = "^2.6"
pytorch-ignite = "^0.4.8"

[tool.poetry.group.dev.dependencies]
black = "^22.0.0"
pytest = "^7.0.0"
jupyter = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
