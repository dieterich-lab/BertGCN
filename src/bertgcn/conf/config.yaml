defaults:
  - hparams: default
  - dataset: default
  - _self_

# Main script parameters
testonly: False

# Paths and directories
# model_name_or_path is now in hparams.yaml for easier sweeping if needed
# output_dir is handled by hydra

# MLflow settings
mlflow_experiment_name: "BertGCN_Finetune"

hydra:
  run:
    dir: outputs/${dataset.doclevel}/${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    direction: maximize
    study_name: finetune_bert
    storage: null
    n_trials: 20
    n_jobs: 1
    params:
      hparams.learning_rate: loguniform(1e-6, 1e-4)
      hparams.batch_size: categorical([8, 16, 32])
