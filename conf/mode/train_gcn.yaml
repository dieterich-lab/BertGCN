# @package _global_

# GCN training mode
mode: train_gcn

# Random seed
seed: 42

# Development mode (limits to 1 epoch for quick testing)
dev: false

# MLflow experiment name for GCN training
mlflow_experiment_name: "minimal_gcn_training"

# Override MLflow tracking URI for GCN
mlflow_tracking_uri: "file:outputs/train_gcn/mlruns"

# Hydra run directory
hydra:
  run:
    dir: outputs/train_gcn/hydra/${now:%Y-%m-%d_%H-%M-%S}

# BERT hyperparameters (needed for BertGCN)
hparams:
  model_name_or_path: "/prj/doctoral_letters/PETGUI/med_bert_local"

# Override data configuration for GCN
data:
  train_ratio: 0.7
  val_ratio: 0.15
  graph_dataset: "data/ind.medindcls_letter_letter"
  use_graph_data: true

# Model configuration for GCN
model:
  n_features: 768
  n_hidden: 200
  dropout: 0.5

# GCN-specific configuration
gcn:
  mix_factor: 0.7
  gcn_layers: 2
  n_hidden: 200
  dropout: 0.5

# Training configuration for GCN
training:
  lr: 0.001
  bert_lr: 0.00001
  epochs: 50

# Disable optimization sweeper for training
hydra:
  sweeper: null