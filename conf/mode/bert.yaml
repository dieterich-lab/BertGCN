# @package _global_

# BERT finetuning mode
mode: bert

# Override experiment name for finetuning
mlflow_experiment_name: "bertgcn_finetuning"

# BERT hyperparameters (needed for finetuning)
hparams:
  model_name_or_path: "/prj/doctoral_letters/PETGUI/med_bert_local"
  seed: 42
  learning_rate: 2e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  num_train_epochs: 50
  batch_size: 32
  eval_steps: 100
  save_steps: 100
  early_stopping_patience: 3
  fp16: True
  gradient_accumulation_steps: 1
  use_stratified_split: True
  use_class_weights: True

  # Disable optimization sweeper for finetuning
  sweeper: null