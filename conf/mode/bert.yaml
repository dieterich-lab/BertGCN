# @package _global_

# BERT finetuning mode
mode: bert

# Override experiment name for finetuning
mlflow_experiment_name: "bertgcn_finetuning"

# Override Hydra run directory to avoid MLflow conflicts
hydra:
  run:
    dir: /beegfs/homes/pwiesenbach/BertGCN/outputs/bert/${now:%Y-%m-%d_%H-%M-%S}

# BERT hyperparameters (needed for finetuning)
hparams:
  model_name_or_path: "/prj/doctoral_letters/PETGUI/med_bert_local"
  seed: 42
  learning_rate: 5e-5  # Increased from 2e-5 for better adaptation
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler_type: "linear"  # Add linear scheduler
  num_train_epochs: 100  # Extended training
  batch_size: 96  # Larger batch size for better generalization
  eval_steps: 100
  save_steps: 100
  early_stopping_patience: 7  # More patience
  fp16: True
  gradient_accumulation_steps: 1
  use_stratified_split: True
  use_class_weights: True
  max_grad_norm: 1.0  # Gradient clipping

  # Disable optimization sweeper for finetuning
  sweeper: null