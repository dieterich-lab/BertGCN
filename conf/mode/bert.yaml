# @package _global_

# BERT finetuning mode
mode: bert

# Override experiment name for finetuning
mlflow_experiment_name: "bertgcn_finetuning"

# Override MLflow tracking URI for BERT
mlflow_tracking_uri: "file:/beegfs/homes/pwiesenbach/BertGCN/outputs/bert/mlruns"

hydra:
  run:
    dir: /beegfs/homes/pwiesenbach/BertGCN/outputs/bert/hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: /beegfs/homes/pwiesenbach/BertGCN/outputs/bert/multirun/${now:%Y-%m-%d_%H-%M-%S}

# BERT hyperparameters (needed for finetuning)
hparams:
  model_name_or_path: "/prj/doctoral_letters/PETGUI/med_bert_local"
  seed: 42
  learning_rate: 2e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  num_train_epochs: 50
  batch_size: 32
  eval_steps: 100
  save_steps: 100
  early_stopping_patience: 3
  fp16: True
  gradient_accumulation_steps: 1
  use_stratified_split: True
  use_class_weights: True

  # Disable optimization sweeper for finetuning
  sweeper: null