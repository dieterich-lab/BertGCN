defaults:
  # 1. Load your application's config groups first.
  - main
  - hparams
  - dataset

  # 2. IMPORTANT: This line is mandatory. It tells Hydra to swap out the
  #    default sweeper schema for the Optuna sweeper schema. This is
  #    what makes keys like 'direction' and 'params' valid.
  - override hydra/sweeper: optuna
  - _self_

hydra:
  run:
    dir: models/finetuned/${basename:${hparams.model_name_or_path}}/${now:%Y-%m-%d_%H-%M-%S}
  # This block provides the values that will override the defaults
  # set by the Optuna plugin's own configuration.
  sweep:
    dir: multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}

  sweeper:
    # We are overriding the default Optuna values here.
    direction: maximize
    study_name: finetune_bert
    storage: null
    n_trials: 20
    n_jobs: 1

    # Define the search space
    params:
      hparams.learning_rate: loguniform(1e-6, 1e-4)
      hparams.batch_size: categorical(8, 16, 32)