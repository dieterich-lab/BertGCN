# Training Configuration
trainer:
  max_epochs: 50
  batch_size: 8
  accumulate_grad_batches: 1
  precision: 16
  enable_progress_bar: true
  log_every_n_steps: 10
  val_check_interval: 0.25
  
# Data splits
data_splits:
  train_ratio: 0.7
  val_ratio: 0.1
  test_ratio: 0.2
  stratify: true

# Early stopping
early_stopping:
  monitor: "val_f1"
  patience: 10
  mode: "max"
  min_delta: 0.001

# Model checkpointing
checkpointing:
  monitor: "val_f1"
  mode: "max"
  save_top_k: 3
  save_last: true
  auto_insert_metric_name: false

# Learning rate scheduling
lr_scheduler:
  name: "cosine"
  warmup_epochs: 5
  min_lr: 1.0e-7
  monitor: "val_loss"

# Data augmentation
augmentation:
  enabled: true
  techniques:
    - "synonym_replacement"
    - "random_insertion"
    - "random_swap"
  augmentation_ratio: 0.1

# Validation strategy
validation:
  strategy: "k_fold"
  k_folds: 5
  shuffle: true
  
# Distributed training
distributed:
  strategy: "ddp"
  num_nodes: 1
  devices: "auto"
  sync_batchnorm: true