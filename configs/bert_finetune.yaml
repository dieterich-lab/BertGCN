# BERT Fine-tuning Configuration
model:
  pretrained_model: "/prj/doctoral_letters/PETGUI/med_bert_local"
  max_length: 512
  dropout: 0.1
  
# Training hyperparameters
training:
  epochs: 50
  batch_size: 8
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_steps: 500
  gradient_clip_val: 1.0
  
# Data settings
data:
  doclevel: "letter"
  clean: true
  nomeds: false
  train_ratio: 0.7
  val_ratio: 0.1
  test_ratio: 0.2
  
# Lightning trainer settings
trainer:
  precision: 16
  enable_progress_bar: true
  log_every_n_steps: 10
  val_check_interval: 0.25
  
# Early stopping
early_stopping:
  monitor: "val_f1"
  patience: 5
  mode: "max"
  min_delta: 0.001
  
# Model checkpointing
checkpointing:
  monitor: "val_f1"
  mode: "max"
  save_top_k: 3
  save_last: true
  
# Logging
logging:
  experiment_name: "bert_finetune"
  log_dir: "bert_logs"
