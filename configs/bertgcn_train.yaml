# BertGCN Training Configuration
model:
  pretrained_model: "/prj/doctoral_letters/PETGUI/med_bert_local"
  mix_factor: 0.7
  gcn_layers: 2
  hidden_dim: 200
  dropout: 0.5
  
# Training hyperparameters
training:
  epochs: 50
  batch_size: 1  # Often small for graph-based models
  bert_lr: 1.0e-5
  gcn_lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  gradient_clip_val: 1.0
  
# Data settings
data:
  doclevel: "letter"
  clean: true
  testunklar: false
  
# Graph construction
graph:
  window_size: 20
  min_word_freq: 1
  
# Lightning trainer settings
trainer:
  precision: 16
  enable_progress_bar: true
  log_every_n_steps: 5
  val_check_interval: 0.5
  
# Early stopping
early_stopping:
  monitor: "val_f1"
  patience: 5
  mode: "max"
  min_delta: 0.001
  
# Model checkpointing
checkpointing:
  monitor: "val_f1"
  mode: "max"
  save_top_k: 3
  save_last: true
  
# Logging
logging:
  experiment_name: "bertgcn_train"
  log_dir: "bertgcn_logs"
