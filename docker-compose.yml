version: '3.8'

services:
  bertgcn-dev:
    build:
      context: .
      target: development
    volumes:
      - .:/app
      - poetry-cache:/root/.cache/pypoetry
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - WANDB_MODE=offline
    ports:
      - "8000:8000"
    depends_on:
      - mlflow
      - redis
      - postgres
    networks:
      - bertgcn-network

  bertgcn-prod:
    build:
      context: .
      target: production
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://bertgcn:password@postgres:5432/bertgcn
    ports:
      - "8001:8000"
    depends_on:
      - mlflow
      - redis
      - postgres
    networks:
      - bertgcn-network
    restart: unless-stopped

  mlflow:
    image: python:3.8-slim
    command: >
      bash -c "pip install mlflow==2.5.0 psycopg2-binary &&
               mlflow server --host 0.0.0.0 --port 5000
               --backend-store-uri postgresql://mlflow:password@postgres:5432/mlflow
               --default-artifact-root ./mlruns"
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - bertgcn-network
    restart: unless-stopped

  wandb-local:
    image: wandb/local:latest
    ports:
      - "8080:8080"
    environment:
      - MYSQL=true
    volumes:
      - wandb-data:/vol
    networks:
      - bertgcn-network
    restart: unless-stopped

  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=bertgcn
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=bertgcn
      - POSTGRES_MULTIPLE_DATABASES=mlflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"
    networks:
      - bertgcn-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - bertgcn-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - bertgcn-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    networks:
      - bertgcn-network
    restart: unless-stopped

volumes:
  poetry-cache:
  postgres-data:
  redis-data:
  wandb-data:
  prometheus-data:
  grafana-data:

networks:
  bertgcn-network:
    driver: bridge