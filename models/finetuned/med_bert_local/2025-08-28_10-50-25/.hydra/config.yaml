project_name: BertGCN
mlflow_experiment_name: bertgcn_finetuning
testonly: false
mlflow_tracking_uri: ${oc.env:MLFLOW_TRACKING_URI, null}
hparams:
  model_name_or_path: /prj/doctoral_letters/PETGUI/med_bert_local
  seed: 42
  learning_rate: 2.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.1
  num_train_epochs: 50
  batch_size: 16
  eval_steps: 100
  save_steps: 100
  early_stopping_patience: 3
  fp16: false
  gradient_accumulation_steps: 1
  use_stratified_split: true
  use_class_weights: true
xai:
  enabled: true
  shap_num_background: 20
  shap_num_samples: 40
  lime_num_samples: 10
  max_tokens_for_xai: 512
  seed: 42
dataset:
  doclevel: letter
  task: MIC
  test_unclear: false
  train_ratio: 0.7
  val_ratio: 0.1
