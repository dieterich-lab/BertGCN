apiVersion: apps/v1
kind: Deployment
metadata:
  name: bertgcn-api
  labels:
    app: bertgcn
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bertgcn
      component: api
  template:
    metadata:
      labels:
        app: bertgcn
        component: api
    spec:
      containers:
      - name: bertgcn
        image: bertgcn:latest
        ports:
        - containerPort: 8000
        env:
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow-service:5000"
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bertgcn-secrets
              key: database-url
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bertgcn-service
spec:
  selector:
    app: bertgcn
    component: api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: LoadBalancer
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bertgcn-retrain
spec:
  schedule: "0 2 * * 0"  # Weekly retraining
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: retrain
            image: bertgcn:latest
            command: ["poetry", "run", "bertgcn", "retrain", "--schedule"]
            env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-service:5000"
          restartPolicy: OnFailure